<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Fashion Stylist</title>
<link rel="stylesheet" href="fashion.css">
</head>
<body>

<main class="container">

<header>
<p>YOUR PERSONAL STYLIST</p>
<h1>AI Fashion Stylist ♡</h1>
<p>あなたにぴったりのコーディネートを。</p>
</header>

<section class="card">

<h2>今日のコーデを相談する</h2>
<p>気温や好みを入力して、AIに服装を提案してもらいましょう。</p>

<form id="fashionForm">

<label for="temperature">今日の気温（℃）</label>
<input type="number" id="temperature" value="15"
min="-50" max="60" required>

<label for="occasion">お出かけ先</label>
<select id="occasion">
<option>大学</option>
<option>デート</option>
<option>カフェ</option>
<option>ショッピング</option>
<option>旅行</option>
<option>女子会</option>
<option>普段のお出かけ</option>
</select>

<label for="style">好きなファッションの系統</label>
<select id="style">
<option>韓国系</option>
<option>きれいめ</option>
<option>カジュアル</option>
<option>ガーリー</option>
<option>ストリート</option>
<option>シンプル</option>
</select>

<label for="preference">好きな色・その他の希望</label>
<textarea id="preference" maxlength="300"
placeholder="例：白やグレーを使いたい"></textarea>

<button id="generateBtn" type="submit">
♡ コーディネートを提案する
</button>

</form>

<p id="status" role="status"></p>

</section>

<section id="result" class="card" hidden>
<h2>Today's Coordinate ♡</h2>
<div id="items"></div>
</section>

<footer>AI Fashion Stylist</footer>

</main>

<script>
document.getElementById('fashionForm')
.addEventListener('submit', generateFashion);

async function generateFashion(event) {
event.preventDefault();

const status = document.getElementById('status');
const result = document.getElementById('result');
const button = document.getElementById('generateBtn');

status.textContent = 'AIがコーデを考えています…';
result.hidden = true;
button.disabled = true;

try {
const response = await fetch('/api/fashion', {
method: 'POST',
headers: {
'Content-Type': 'application/json'
},
body: JSON.stringify({
temperature: document.getElementById('temperature').value,
occasion: document.getElementById('occasion').value,
style: document.getElementById('style').value,
preference: document.getElementById('preference').value
})
});

// JSONデータを解析する
const data = JSON.parse(await response.text());

if (!response.ok) {
throw new Error(data.error || 'API error');
}

if (!Array.isArray(data.data) || !data.data.length) {
throw new Error('データ形式が正しくありません。');
}

const outfit = data.data[0];

const labels = {
tops: 'トップス',
bottoms: 'ボトムス',
outer: 'アウター',
shoes: 'シューズ',
bag: 'バッグ',
accessories: 'アクセサリー',
colors: 'おすすめの配色',
point: '着こなしのポイント'
};

const items = document.getElementById('items');
items.replaceChildren();

for (const [key, label] of Object.entries(labels)) {
const row = document.createElement('div');
row.className = 'item';

const heading = document.createElement('h3');
heading.textContent = label;

const text = document.createElement('p');
text.textContent = Array.isArray(outfit[key])
? outfit[key].join(' ・ ')
: outfit[key] || 'なし';

row.append(heading, text);
items.appendChild(row);
}

result.hidden = false;
status.textContent = 'コーディネートが完成しました ♡';

} catch (error) {
status.textContent = '生成に失敗しました。もう一度お試しください。';
} finally {
button.disabled = false;
}
}
</script>

</body>
</html>
